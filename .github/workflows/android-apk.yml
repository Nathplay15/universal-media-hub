name: CI — tests + APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests unitaires + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build complet (types, providers, server, web)
        run: npm run build

  apk:
    name: Générer app-debug.apk
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Build web + packages
        run: npm run build

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          cmdline-tools-version: latest
          platform-version: 34
          build-tools-version: 34.0.0

      - name: Synchroniser Capacitor
        working-directory: apps/web
        run: npx cap sync android

      - name: Assembler l'APK debug
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mediahub-app-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
