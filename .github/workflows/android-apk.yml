name: CI — tests + APK Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tests unitaires + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build complet (types, providers, server, web)
        run: npm run build

  apk:
    name: Générer app-debug.apk
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Build web + packages
        run: npm run build

      - name: Installer le JDK 21 (requis par le template Capacitor 7.4)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Licences et packages SDK Android (SDK préinstallé du runner)
        run: |
          SDKM=$(command -v sdkmanager || echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKM" --licenses
          "$SDKM" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          "$SDKM" --list_installed | head -20

      - name: Synchroniser Capacitor
        working-directory: apps/web
        run: npx cap sync android

      - name: Assembler l'APK debug
        working-directory: apps/web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mediahub-app-debug-apk
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
